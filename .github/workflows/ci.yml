name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: extractions/setup-just@v2
      # Playwright runs in the runner's preinstalled Google Chrome.
      - run: just check
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: web/test-results/
          retention-days: 7

  image:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: ${{ vars.PROD_URL }}
    env:
      COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      PROD_URL: ${{ vars.PROD_URL }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ] || [ -z "$PROD_URL" ]; then
            echo "::notice::Deploy skipped: set secrets COOLIFY_WEBHOOK, COOLIFY_TOKEN and variable PROD_URL."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger Coolify deploy
        if: steps.config.outputs.enabled == 'true'
        run: |
          curl --fail-with-body -sS -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK"
      - name: Wait for the new version to go live
        if: steps.config.outputs.enabled == 'true'
        run: |
          for _ in $(seq 1 60); do
            live=$(curl -fsS "$PROD_URL/version.txt" 2>/dev/null || true)
            if [ "$live" = "$GITHUB_SHA" ]; then echo "Live: $live"; exit 0; fi
            sleep 10
          done
          echo "::error::$PROD_URL still serves '${live}', expected $GITHUB_SHA"
          exit 1
      - if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@v4
      - if: steps.config.outputs.enabled == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - if: steps.config.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Browser tests against production
        if: steps.config.outputs.enabled == 'true'
        working-directory: web
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          E2E_BASE_URL="$PROD_URL" pnpm exec playwright test
