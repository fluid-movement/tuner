server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # mime.types (included by the base config) maps .wasm to application/wasm,
    # which streaming compilation needs. Don't add a `types` block here: it
    # would replace the whole table.

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm application/manifest+json;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # The tuner needs the microphone on this origin only.
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Content-hashed build output never changes.
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Same URL across releases: always revalidate.
    location /wasm/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
        try_files $uri $uri.html $uri/ /index.html;
    }
}
