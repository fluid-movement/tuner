[workspace]
resolver = "3"
members = ["crates/tuner-core", "crates/tuner-wasm", "crates/tuner-lab"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
# Drops the WASM name section (~16 KB) and native symbols.
strip = true

# The analysis core is optimised for size: ~8 KB smaller wasm (budget
# 160 KB) at no measurable cost (chord 2.0 -> 2.3 ms, guitar strum
# 11.5 -> 9.8 ms per analysis natively).
[profile.release.package.tuner-core]
opt-level = "s"
