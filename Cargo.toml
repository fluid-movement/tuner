[workspace]
resolver = "3"
members = ["crates/tuner-core", "crates/tuner-wasm", "crates/tuner-lab"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
# Drops the WASM name section (~16 KB) and native symbols.
strip = true
